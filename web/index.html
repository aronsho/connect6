<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect6</title>
  <meta name="description" content="Play Connect6 in your browser against the E6 bot or a friend.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='5' cy='8' r='4' fill='%2333b864'/><circle cx='11' cy='8' r='4' fill='%23e04848'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Connect6</h1>
      <p class="rules">Get <b>six in a row</b> (any direction). Green opens with one stone, then each player places <b>two stones</b> per turn.</p>
    </header>

    <section class="controls" aria-label="Game setup">
      <label><span class="dot p1"></span>Player 1
        <select id="p1">
          <option value="human" selected>Human</option>
          <option value="bot1">Bot – greedy</option>
          <option value="bot2">Bot – lookahead</option>
        </select>
      </label>
      <label><span class="dot p2"></span>Player 2
        <select id="p2">
          <option value="human">Human</option>
          <option value="bot1">Bot – greedy</option>
          <option value="bot2" selected>Bot – lookahead</option>
        </select>
      </label>
      <button id="new">New game</button>
      <button id="undo" class="secondary">Undo</button>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <div class="board-wrap">
      <canvas id="board" aria-label="Connect6 board"></canvas>
    </div>

    <footer>
      Tip: click your first stone again to take it back before placing the second.
    </footer>
  </main>

  <script src="connect6.js"></script>
  <script src="bot.js"></script>
  <script src="main.js"></script>
</body>
</html>
