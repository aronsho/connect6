<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect6</title>
  <meta name="description" content="Play Connect6 in your browser against the E6 bot or a friend.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='5' cy='8' r='4' fill='%233b9be0'/><circle cx='11' cy='8' r='4' fill='%23f0a020'/></svg>">
  <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
  <main>
    <header>
      <div class="title-row">
        <h1>Connect6</h1>
        <button id="tutorial-btn" class="small">Tutorial</button>
      </div>
      <p class="rules">Get <b>six in a row</b> (any direction). Blue opens with one stone, then each player places <b>two stones</b> per turn.</p>
    </header>

    <section class="controls" aria-label="Game setup">
      <label><span class="dot p1"></span>Player 1
        <select id="p1">
          <option value="human" selected>Human</option>
          <option value="bot1">Bot – medium</option>
          <option value="bot2">Bot – expert</option>
          <option value="bot3">Bot – killer</option>
          <option value="bot4">Bot – god</option>
        </select>
      </label>
      <label><span class="dot p2"></span>Player 2
        <select id="p2">
          <option value="human">Human</option>
          <option value="bot1">Bot – medium</option>
          <option value="bot2" selected>Bot – expert</option>
          <option value="bot3">Bot – killer</option>
          <option value="bot4">Bot – god</option>
        </select>
      </label>
      <button id="new">New game</button>
      <button id="undo" class="secondary">Undo</button>
      <button id="pause" class="secondary" hidden>Pause</button>
      <span id="browse" class="browse" hidden>
        <button id="back" class="secondary" title="Previous move (←)" aria-label="Previous move">◀</button>
        <button id="fwd" class="secondary" title="Next move (→)" aria-label="Next move">▶</button>
      </span>
      <button id="resign" class="secondary" hidden>Resign</button>
    </section>

    <section class="online" aria-label="Online play">
      <button id="host" class="secondary">Play a friend online</button>
      <div id="online-info" hidden>
        <p id="online-status" role="status" aria-live="polite"></p>
        <p id="score" hidden></p>
        <div id="offer-row" class="offer-row" hidden>
          <span id="offer-text"></span>
          <button id="accept">Accept</button>
          <button id="decline" class="secondary">Decline</button>
        </div>
        <div id="share-row" class="share-row">
          <input id="share-link" readonly aria-label="Link to send to your friend">
          <button id="copy">Copy link</button>
        </div>
        <button id="leave" class="secondary">Leave online game</button>
      </div>
    </section>

    <div class="status-row">
      <p id="status" role="status" aria-live="polite"></p>
      <button id="zoom" class="secondary small" aria-pressed="false">Zoom in</button>
    </div>

    <div id="board-wrap" class="board-wrap">
      <canvas id="board" aria-label="Connect6 board"></canvas>
    </div>

    <div id="tutorial" class="tutorial" role="region" aria-label="Tutorial" hidden>
      <div class="tut-head"><span id="tut-progress"></span></div>
      <p id="tut-text" aria-live="polite"></p>
      <div class="tut-actions">
        <button id="tut-stop" class="secondary">Stop tutorial</button>
        <button id="tut-next">Next</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="connect6.js?v=dev"></script>
  <script src="online.js?v=dev"></script>
  <script src="bot.js?v=dev"></script>
  <script src="tutorial.js?v=dev"></script>
  <script src="main.js?v=dev"></script>
</body>
</html>
