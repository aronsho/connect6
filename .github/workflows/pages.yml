# Publishes the web/ folder to GitHub Pages on every push to master.
# Two jobs (build, then deploy) as in GitHub's official Pages template: deploying
# in the same job that uploaded the artifact sometimes fails with
# 'No artifacts named "github-pages" were found'.
name: Deploy web game to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Cache-bust: point index.html at this commit's CSS/JS, so browsers never mix versions.
      - run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" web/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
